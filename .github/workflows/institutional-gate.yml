name: Institutional Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  institutional-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run validate
      - run: npm run watchdog
